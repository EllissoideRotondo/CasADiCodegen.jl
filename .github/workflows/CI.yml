name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage makes Julia compile every dependency again with instrumentation, so one job measures it.
          # Julia 1.12 compiles the generated code of the fixed-step integrators slowly with forced bounds
          # checks (about 13 minutes against 1 for the group nodes), so 1.13 alone forces them.
          - version: '1.13'
            coverage: true
            check_bounds: 'yes'
          - version: '1.12'
            coverage: false
            check_bounds: 'auto'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          # The cleanup of old caches runs Pkg.gc(), which deletes the packages of the test environment
          # of Pkg.test, a temporary one, so that each run installed and compiled them again.
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
          check_bounds: ${{ matrix.check_bounds }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: lcov.info
          use_oidc: true
          # A pull request from a fork gets no OIDC token, so a failed upload does not fail the job.
          fail_ci_if_error: false
