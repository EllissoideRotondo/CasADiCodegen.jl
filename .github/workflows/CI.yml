name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Codecov authenticates the coverage upload with a GitHub OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage makes Julia compile every dependency again with instrumentation, so one job measures it.
          - version: '1.13'
            coverage: true
          - version: '1.12'
            coverage: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: lcov.info
          use_oidc: true
          # A pull request from a fork gets no OIDC token, so a failed upload does not fail the job.
          fail_ci_if_error: false
